<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 앱 작업대</title>
<meta name="description" content="휴대폰으로 바이브코딩한 앱 모음">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f6f5f2; --surface: #fff; --text: #1b1b1f; --text-2: #5f5f68; --text-3: #9a9aa3;
    --line: rgba(20, 20, 30, .08); --tint-s: 80%; --tint-l: 94%; --strong-s: 65%; --strong-l: 40%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #1b1b1e; --text: #f2f2f4; --text-2: #a8a8b2; --text-3: #6c6c76;
      --line: rgba(255, 255, 255, .07); --tint-s: 28%; --tint-l: 16%; --strong-s: 80%; --strong-l: 72%;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; letter-spacing: -.01em;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 16px calc(40px + env(safe-area-inset-bottom)); }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--text-2); }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -.035em; margin: 2px 0 20px; display: flex; align-items: baseline; gap: 8px; }
  h1 small { font-size: 16px; font-weight: 700; color: var(--text-3); }
  h2 { font-size: 14px; font-weight: 700; color: var(--text-2); margin: 32px 4px 10px; }
  .grid { display: grid; gap: 10px; }
  .c {
    --tint: hsl(var(--h) var(--tint-s) var(--tint-l));
    --strong: hsl(var(--h) var(--strong-s) var(--strong-l));
  }
  .app {
    display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 18px;
    background: var(--tint); color: inherit; text-decoration: none; transition: transform .15s;
  }
  .app:active { transform: scale(.98); }
  .badge { width: 54px; height: 54px; border-radius: 16px; background: var(--surface); display: grid; place-items: center; font-size: 27px; flex: none; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 750; letter-spacing: -.02em; }
  .desc { font-size: 13.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .date { font-size: 12px; font-weight: 650; color: var(--strong); margin-top: 2px; }
  .chev { color: var(--strong); font-size: 22px; flex: none; }
  .empty { text-align: center; padding: 40px 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); color: var(--text-2); }
  .empty .big { font-size: 34px; margin-bottom: 6px; }
  .how { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px 18px; }
  .how ol { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  .how li { counter-increment: step; display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; font-size: 15px; }
  .how li + li { border-top: 1px solid var(--line); }
  .how li::before {
    content: counter(step); width: 24px; height: 24px; border-radius: 50%; flex: none; margin-top: 1px;
    background: var(--text); color: var(--bg); font-size: 13px; font-weight: 700; display: grid; place-items: center;
  }
  .how em { font-style: normal; color: var(--text-2); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">바이브코딩 작업대</div>
  <h1>내 앱 <small id="count"></small></h1>
  <div id="list" class="grid"></div>

  <h2>새 앱 만들기</h2>
  <section class="how">
    <ol>
      <li><span>휴대폰 Claude 앱에서 <b>Code</b> 탭 열기</span></li>
      <li><span>이 저장소 고르기</span></li>
      <li><span>만들고 싶은 앱 말하기 <em>— "물 마신 양 기록하는 앱 만들어줘"</em></span></li>
      <li><span>Claude가 만든 PR을 <b>Merge</b> 하면 1~2분 뒤 여기에 나타나요</span></li>
    </ol>
  </section>
</div>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HUES = [38, 18, 352, 325, 266, 230, 203, 172, 142];
  const hue = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.codePointAt(0)) >>> 0; return HUES[h % HUES.length]; };
  const list = document.getElementById('list');

  fetch('apps.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(apps => {
      apps.sort((a, b) => String(b.created).localeCompare(String(a.created)));
      document.getElementById('count').textContent = apps.length ? apps.length + '개' : '';
      list.innerHTML = apps.length
        ? apps.map(a => `
          <a class="app c" style="--h:${hue(a.id)}" href="apps/${encodeURIComponent(a.id)}/">
            <span class="badge">${esc(a.emoji || '✨')}</span>
            <span class="info">
              <div class="name">${esc(a.name)}</div>
              ${a.description ? `<div class="desc">${esc(a.description)}</div>` : ''}
              ${a.created ? `<div class="date">${esc(a.created)}</div>` : ''}
            </span>
            <span class="chev">›</span>
          </a>`).join('')
        : '<div class="empty"><div class="big">🌱</div>아직 만든 앱이 없어요.<br>아래 순서대로 첫 앱을 만들어 보세요.</div>';
    })
    .catch(() => { list.innerHTML = '<div class="empty">앱 목록을 불러오지 못했어요.</div>'; });
</script>
</body>
</html>
