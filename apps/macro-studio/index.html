<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매크로 설계소</title>
<meta name="description" content="클릭·키보드 동작 순서를 눈으로 짜고, PC에서 도는 매크로 파일로 내보내요">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="icon-btn" href="../../" aria-label="갤러리로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <h1>매크로 설계소</h1>
  <button class="icon-btn" id="help-btn" aria-label="도움말">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"/><path d="M12 17h.01"/></svg>
  </button>
</header>

<main class="wrap">
  <!-- 루프(동작 묶음) 선택 줄 -->
  <section class="loops">
    <div class="loops-head">
      <span class="label">루프 (동작 묶음)</span>
      <button class="mini" id="add-loop">+ 새 루프</button>
    </div>
    <div class="chips" id="loop-chips"></div>
  </section>

  <!-- 현재 루프 설정 -->
  <section class="card loop-settings" id="loop-settings">
    <div class="row">
      <label class="field grow">
        <span>루프 이름</span>
        <input type="text" id="loop-name" placeholder="예: 메일 보내기" autocomplete="off">
      </label>
    </div>
    <div class="row">
      <label class="field">
        <span>반복 횟수</span>
        <input type="number" id="loop-repeat" min="0" value="1" inputmode="numeric">
        <em>0 = 멈출 때까지 무한</em>
      </label>
      <label class="field">
        <span>시작 전 대기(초)</span>
        <input type="number" id="loop-delay" min="0" step="0.5" value="3" inputmode="decimal">
        <em>창 전환할 시간</em>
      </label>
    </div>
  </section>

  <!-- 동작 목록 -->
  <section class="steps-head">
    <h2>동작 순서</h2>
    <span class="count" id="steps-count"></span>
  </section>
  <ol class="steps" id="steps"></ol>
  <p class="empty-steps" id="empty-steps" hidden>아직 동작이 없어요. 아래 <b>+ 동작 추가</b>를 눌러 시작하세요.</p>

  <!-- 내보내기 -->
  <section class="card export">
    <h3>이 루프를 실행 파일로 내보내기</h3>
    <p class="muted small">PC에서 아래 파일을 받아 실행하면 실제로 마우스·키보드가 움직여요.</p>
    <div class="export-grid">
      <button class="out" data-export="ps"><b>무설치 (윈도우)</b><span>설치 없이 더블클릭</span></button>
      <button class="out" data-export="ahk"><b>.ahk + .bat</b><span>윈도우 · 설치형 · 안정적</span></button>
      <button class="out" data-export="py"><b>.py (파이썬)</b><span>맥·윈도우 공용</span></button>
    </div>
    <div class="export-grid">
      <button class="out ghost" data-export="finder"><b>좌표 찾기 도우미</b><span>X·Y 숫자 알아내기</span></button>
      <button class="out ghost" data-export="backup"><b>전체 백업 저장</b><span>모든 루프를 파일로</span></button>
      <button class="out ghost" id="import-btn"><b>백업 불러오기</b><span>파일에서 되돌리기</span></button>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
  </section>

  <!-- F12 소스 분석 -->
  <section class="card analyze">
    <h3>F12 페이지 소스에서 이름 찾기</h3>
    <p class="muted small">페이지에서 <b>F12</b>로 나온 코드(HTML)를 통째로 붙여넣으면, 제목·버튼·링크 글자를 뽑아줘요. 창을 제목으로 찾아가는 동작에 쓰면 위치가 바뀌어도 잘 찾아가요.</p>
    <textarea id="html-input" rows="4" placeholder="여기에 페이지 소스(HTML)를 붙여넣으세요"></textarea>
    <button class="mini wide" id="analyze-btn">분석하기</button>
    <div id="analyze-result" class="analyze-result"></div>
  </section>
</main>

<!-- 아래 고정 추가 버튼 -->
<div class="bottom">
  <button class="btn" id="add-step">+ 동작 추가</button>
</div>

<!-- 동작 편집 시트 -->
<div class="sheet-bg" id="sheet-bg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <span id="sheet-title">동작 추가</span>
    <button class="mini ghost" id="sheet-close">닫기</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot">
    <button class="btn" id="sheet-save">저장</button>
  </div>
</div>

<!-- 도움말 시트 -->
<div class="sheet-bg" id="help-bg" hidden></div>
<div class="sheet" id="help-sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <span>사용 설명서</span>
    <button class="mini ghost" id="help-close">닫기</button>
  </div>
  <div class="sheet-body help-body" id="help-body"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
